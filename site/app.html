<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — LockIQ Rates</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080f1d;
      --card:      #0f1f3d;
      --card-alt:  #132240;
      --border:    #1a3366;
      --navy:      #0f1f3d;
      --blue:      #1a56db;
      --gold:      #f5a623;
      --text:      #e8edf5;
      --muted:     #8aaad4;
      --green:     #22c55e;
      --red:       #ef4444;
      --yellow:    #f59e0b;
    }

    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── NAV ── */
    nav { background: var(--navy); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; height: 56px; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
    .logo { color: #fff; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { color: var(--gold); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-meta { display: flex; align-items: center; gap: 1.25rem; }
    #last-updated { font-size: 0.78rem; color: var(--muted); }
    #refresh-indicator { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; transition: background 0.3s; }
    #refresh-indicator.stale { background: var(--yellow); }
    #refresh-indicator.error { background: var(--red); }
    #countdown { font-size: 0.74rem; color: var(--muted); }
    .market-closed-badge { font-size: 0.63rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.18rem 0.55rem; border-radius: 4px; text-transform: uppercase; background: rgba(139,153,180,0.1); color: var(--muted); border: 1px solid rgba(139,153,180,0.25); }
    .signal-badge.closed { opacity: 0.35; filter: grayscale(1); }
    #user-email { color: var(--muted); font-size: 0.8rem; }
    #sign-out-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--muted); padding: 0.35rem 0.85rem; border-radius: 5px; font-size: 0.78rem; cursor: pointer; }
    #sign-out-btn:hover { border-color: rgba(255,255,255,0.4); color: #fff; }

    /* ── LOADING ── */
    #loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 1rem; color: var(--muted); }
    .spinner { width: 40px; height: 40px; border: 3px solid #1a3366; border-top-color: var(--blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── APP SHELL ── */
    #app-shell { display: none; }
    .dashboard { max-width: 1400px; margin: 0 auto; padding: 1.25rem 1.5rem 3rem; display: flex; flex-direction: column; gap: 1.25rem; }

    /* ── SECTION WRAPPER ── */
    .dash-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; }
    .section-hd { display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1.1rem; }
    .section-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }

    /* ── CONTROLS (engine top bar) ── */
    .engine-controls { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .ctrl-group { display: flex; flex-direction: column; gap: 0.2rem; }
    .ctrl-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    select, input[type="number"] { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.65rem; border-radius: 6px; font-size: 0.85rem; font-family: inherit; }
    select:focus, input:focus { outline: none; border-color: var(--blue); }
    .quality-badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.25rem 0.6rem; border-radius: 4px; text-transform: uppercase; }
    .quality-ok { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .quality-warn { background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); }
    .quality-err { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }

    /* ── PRICING CARDS ── */
    .pricing-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .pricing-card { background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .card-product { font-size: 0.68rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .card-pts { font-size: 2.6rem; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .card-pts.positive { color: var(--green); }
    .card-pts.negative { color: var(--red); }
    .card-pts.neutral  { color: var(--muted); }
    .card-pts-label { font-size: 0.72rem; color: var(--muted); }
    .card-bps { font-size: 0.82rem; color: var(--muted); }
    .signal-badge { display: inline-flex; align-items: center; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.2rem 0.55rem; border-radius: 4px; width: fit-content; margin-top: 0.25rem; }
    .signal-better { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .signal-worse  { background: rgba(239,68,68,0.15);  color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .signal-flat   { background: rgba(139,153,180,0.15); color: var(--muted); border: 1px solid rgba(139,153,180,0.3); }

    /* ── CHART ── */
    .chart-view-tabs { display: flex; gap: 0.25rem; }
    .chart-view-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0.3rem 0.75rem; border-radius: 6px; font-size: 0.75rem; cursor: pointer; font-family: inherit; transition: background 0.15s; }
    .chart-view-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .chart-summary { display: flex; align-items: flex-start; gap: 2rem; padding: 0.6rem 0 0.9rem; border-bottom: 1px solid var(--border); margin-bottom: 0.85rem; flex-wrap: wrap; row-gap: 0.5rem; }
    .chart-sum-item { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; }
    .chart-sum-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    .chart-sum-value { font-size: 1.05rem; font-weight: 700; line-height: 1.2; }
    .chart-sum-sub   { font-size: 0.74rem; color: var(--muted); }
    .chart-wrap { position: relative; height: 280px; }

    /* ── MARKET TILES ── */
    .market-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .market-tile { background: var(--card-alt); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.25rem; }
    .tile-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
    .tile-value { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    .tile-change { font-size: 0.82rem; font-weight: 600; margin-top: 0.2rem; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
    .neu { color: var(--muted); }

    /* ── TWO COLUMN LAYOUT ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }

    /* ── RATE TABLES ── */
    .rate-panel-title { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.75rem; }
    .rate-table { width: 100%; border-collapse: collapse; }
    .rate-table th { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); text-align: left; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
    .rate-table td { font-size: 0.88rem; padding: 0.45rem 0; border-bottom: 1px solid rgba(26,51,102,0.5); }
    .rate-table td:last-child { text-align: right; }
    .rate-table .product-cell { color: var(--muted); font-size: 0.8rem; }
    .as-of-note { font-size: 0.68rem; color: var(--muted); margin-top: 0.6rem; }
    .two-panels   { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .three-panels { display: grid; grid-template-columns: repeat(3,1fr); gap: 1.5rem; }

    /* ── FED SNAPSHOT ── */
    .fed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .fed-item { background: var(--card-alt); border: 1px solid var(--border); border-radius: 8px; padding: 0.85rem 1rem; }
    .fed-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 0.3rem; }
    .fed-value { font-size: 1.4rem; font-weight: 700; }

    /* ── ECON CALENDAR ── */
    .cal-tabs { display: flex; gap: 0.25rem; margin-bottom: 1rem; }
    .cal-tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 0.35rem 0.85rem; border-radius: 6px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .cal-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .cal-table { width: 100%; border-collapse: collapse; }
    .cal-table th { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); text-align: left; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border); }
    .cal-table td { font-size: 0.82rem; padding: 0.5rem 0.5rem; border-bottom: 1px solid rgba(26,51,102,0.4); vertical-align: middle; }
    .impact-high   { display: inline-block; background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.15rem 0.45rem; border-radius: 4px; text-transform: uppercase; }
    .impact-medium { display: inline-block; background: rgba(245,158,11,0.15); color: var(--yellow); border: 1px solid rgba(245,158,11,0.3); font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; padding: 0.15rem 0.45rem; border-radius: 4px; text-transform: uppercase; }
    .cal-empty { color: var(--muted); font-size: 0.85rem; padding: 1rem 0.5rem; }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      .pricing-cards { grid-template-columns: 1fr; }
      .market-tiles  { grid-template-columns: 1fr; }
      .two-col       { grid-template-columns: 1fr; }
      .two-panels    { grid-template-columns: 1fr; }
      .three-panels  { grid-template-columns: 1fr; }
      .fed-grid      { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .engine-controls { flex-direction: column; align-items: flex-start; }
      .nav-meta { display: none; }
    }
  </style>
</head>
<body>

<!-- ── LOADING ── -->
<div id="loading-screen">
  <div class="spinner"></div>
  <span>Loading dashboard&hellip;</span>
</div>

<!-- ── APP SHELL ── -->
<div id="app-shell">

  <!-- NAV -->
  <nav>
    <div class="logo">Lock<span>IQ</span> Rates</div>
    <div class="nav-right">
      <div class="nav-meta">
        <span id="refresh-indicator"></span>
        <span id="last-updated">—</span>
        <span id="countdown"></span>
      </div>
      <span id="user-email"></span>
      <button id="sign-out-btn">Sign out</button>
    </div>
  </nav>

  <div class="dashboard">

    <!-- ── SECTION 1: LOCKIQ PRICING ENGINE ── -->
    <div class="dash-section" id="section-engine">
      <div class="section-hd">
        <div style="display:flex;align-items:center;gap:.75rem;">
          <span class="section-title">LockIQ Pricing Engine</span>
          <span id="quality-badge" class="quality-badge"></span>
          <span id="market-closed-badge" class="market-closed-badge" style="display:none">Market Closed</span>
        </div>
        <div class="engine-controls">
          <div class="ctrl-group">
            <span class="ctrl-label">Compare vs</span>
            <select id="anchor-select"><option value="">— loading —</option></select>
          </div>
        </div>
      </div>
      <div class="pricing-cards" id="pricing-cards">
        <!-- rendered by JS -->
      </div>
    </div>

    <!-- ── SECTION 2: CHART ── -->
    <div class="dash-section" id="section-chart">
      <div class="section-hd">
        <span class="section-title">LockIQ Pricing Index</span>
        <div class="chart-view-tabs" id="chart-view-tabs">
          <button class="chart-view-tab active" data-view="today">Today</button>
          <button class="chart-view-tab" data-view="yesterday">Yesterday</button>
          <button class="chart-view-tab" data-view="week">This Week</button>
          <button class="chart-view-tab" data-view="30d">30 Days</button>
        </div>
      </div>
      <div id="chart-summary"></div>
      <div class="chart-wrap">
        <canvas id="lockiq-chart-canvas"></canvas>
      </div>
    </div>

    <!-- ── SECTION 3: MARKET PROXY ── -->
    <div class="dash-section" id="section-market">
      <div class="section-hd">
        <span class="section-title">Live Market Proxy Indicators</span>
      </div>
      <div class="market-tiles" id="market-tiles">
        <!-- rendered by JS -->
      </div>
    </div>

    <!-- ── SECTIONS 4 + 5 side by side ── -->
    <div class="two-col">

      <!-- SECTION 4: BROKER RATES -->
      <div class="dash-section" id="section-rates">
        <div class="section-hd" style="margin-bottom:.75rem;">
          <span class="section-title">Broker Rates</span>
        </div>
        <div class="two-panels" id="broker-panels">
          <!-- rendered by JS -->
        </div>
      </div>

      <!-- SECTION 5: FED SNAPSHOT -->
      <div class="dash-section" id="section-fed">
        <div class="section-hd" style="margin-bottom:.75rem;">
          <span class="section-title">Fed Snapshot</span>
        </div>
        <div class="fed-grid" id="fed-grid">
          <!-- rendered by JS -->
        </div>
      </div>

    </div>

    <!-- ── SECTION 6: ECONOMIC CALENDAR ── -->
    <div class="dash-section" id="section-calendar">
      <div class="section-hd" style="margin-bottom:.75rem;">
        <span class="section-title">Economic Calendar</span>
        <div class="cal-tabs" id="cal-tabs">
          <button class="cal-tab active" data-tab="today">Today</button>
          <button class="cal-tab" data-tab="tomorrow">Tomorrow</button>
          <button class="cal-tab" data-tab="week">This Week</button>
          <button class="cal-tab" data-tab="next">Next Week</button>
        </div>
      </div>
      <div id="cal-content">Loading...</div>
    </div>

  </div><!-- /.dashboard -->
</div><!-- /#app-shell -->

<!-- Clerk JS -->
<script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

<script>
// ════════════════════════════════════════════════════════════════════════════
// DASHBOARD STATE
// ════════════════════════════════════════════════════════════════════════════
const state = {
  index:   null,   // getLockIQIndex response
  chart:   null,   // getLockIQChart response
  market:  null,   // getMarketData response
  anchorKey: null, // currently selected anchor
  calTab: 'today',
  chartView: 'today',
  historyCache: {},   // keyed by days string; each entry: { data, ts }
};
let chartInstance    = null;
let _chartPoints     = [];     // current chart point objects (for tooltip label lookup)
let _nextRefreshAt   = 0;      // ms timestamp when next refresh fires
let _countdownHandle = null;   // setInterval handle for countdown ticker

// ════════════════════════════════════════════════════════════════════════════
// HELPERS
// ════════════════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : null; };
const fmt  = (n, dec=2) => n == null ? '—' : n.toFixed(dec);
const fmtRate = n => n == null ? '—' : n.toFixed(3) + '%';
const sign = n => n == null ? '' : n > 0 ? '+' : '';

function dirClass(n, invertColors) {
  if (n == null) return 'neu';
  if (invertColors) return n > 0 ? 'neg' : n < 0 ? 'pos' : 'neu';
  return n > 0 ? 'pos' : n < 0 ? 'neg' : 'neu';
}

// ── Date utilities ────────────────────────────────────────────────────────
function etDateString(offsetDays = 0) {
  // Approximates Eastern Time (UTC-4 during DST, UTC-5 standard)
  const now = new Date();
  const etOffset = -5 * 60; // conservative; close enough for calendar filtering
  const et = new Date(now.getTime() + (now.getTimezoneOffset() + etOffset) * 60000);
  et.setDate(et.getDate() + offsetDays);
  return et.toISOString().slice(0, 10);
}

function getWeekRange(weekOffset = 0) {
  const now = new Date();
  const etOffset = -5 * 60;
  const et = new Date(now.getTime() + (now.getTimezoneOffset() + etOffset) * 60000);
  const day = et.getDay(); // 0=Sun
  const monday = new Date(et); monday.setDate(et.getDate() - (day === 0 ? 6 : day - 1) + weekOffset * 7);
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  return { start: monday.toISOString().slice(0, 10), end: friday.toISOString().slice(0, 10) };
}

function formatTime12(timeStr) {
  if (!timeStr) return '—';
  // Handle "HH:MM" or "HH:MM:SS"
  const parts = timeStr.split(':');
  if (parts.length < 2) return timeStr;
  let h = parseInt(parts[0], 10);
  const m = parts[1].padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${m} ${ampm}`;
}

// ── FRED value extractor ──────────────────────────────────────────────────
function fredVal(cache, key) {
  if (!cache) return null;
  const keys = [key, key.toLowerCase(), key.toUpperCase()];
  for (const k of keys) {
    const v = cache[k];
    if (v == null) continue;
    if (typeof v === 'object' && v.latest != null) return num(v.latest);
    const n = num(v);
    if (n != null) return n;
  }
  return null;
}

function fredChange(cache, key) {
  if (!cache) return null;
  const v = cache[key] ?? cache[key.toLowerCase()] ?? cache[key.toUpperCase()];
  if (v && typeof v === 'object' && v.change != null) return num(v.change);
  return null;
}

function fredDate(cache, key) {
  if (!cache) return null;
  const v = cache[key] ?? cache[key.toLowerCase()] ?? cache[key.toUpperCase()];
  if (v && typeof v === 'object') return v.latestDate ?? v.date ?? null;
  return null;
}

// ════════════════════════════════════════════════════════════════════════════
// DATA FETCHING
// ════════════════════════════════════════════════════════════════════════════
async function fetchAll() {
  const [indexRes, chartRes, marketRes] = await Promise.allSettled([
    fetch('/.netlify/functions/getLockIQIndex').then(r => r.ok ? r.json() : null),
    fetch('/.netlify/functions/getLockIQChart').then(r  => r.ok ? r.json() : null),
    fetch('/.netlify/functions/getMarketData').then(r  => r.ok ? r.json() : null),
  ]);

  let ok = false;
  if (indexRes.status  === 'fulfilled' && indexRes.value)  { state.index  = indexRes.value;  ok = true; }
  if (chartRes.status  === 'fulfilled' && chartRes.value)  { state.chart  = chartRes.value;  ok = true; }
  if (marketRes.status === 'fulfilled' && marketRes.value) { state.market = marketRes.value; ok = true; }

  if (state.index && !state.anchorKey) {
    state.anchorKey = state.index.default_anchor_key || '0715';
  }

  return ok;
}

// ════════════════════════════════════════════════════════════════════════════
// REFRESH ENGINE — AZ time-aware, smart selective re-render
// ════════════════════════════════════════════════════════════════════════════

// America/Phoenix = UTC-7, no DST ever
function _azNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'America/Phoenix' }));
}

function isMarketOpen() {
  const az = _azNow();
  const day = az.getDay(); // 0=Sun, 6=Sat
  if (day === 0 || day === 6) return false;
  const t = az.getHours() * 60 + az.getMinutes();
  return t >= 6 * 60 && t < 17 * 60;
}

function _getRefreshInterval() {
  const az  = _azNow();
  const day = az.getDay();
  const t   = az.getHours() * 60 + az.getMinutes();
  if (day === 0 || day === 6)         return 1800; // weekends
  if (t >= 6*60  && t < 17*60)       return 120;  // market hours: 6 AM – 5 PM
  if (t >= 5*60  && t < 6*60)        return 300;  // pre-market:  5 AM – 6 AM
  if (t >= 17*60 && t < 21*60)       return 600;  // after-hours: 5 PM – 9 PM
  return 1800;                                      // overnight
}

async function doRefresh() {
  const prevCount   = state.chart?.point_count;
  const prevUpdated = state.chart?.last_updated;

  $('refresh-indicator').className = 'stale';
  let ok = false;
  try { ok = await fetchAll(); } catch (_) {}
  $('refresh-indicator').className = ok ? '' : 'error';

  const ts = new Date();
  $('last-updated').textContent = 'Updated ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  // Selective re-render — skip chart unless data changed
  renderAnchorSelector();
  renderPricingEngine();
  renderChartSummary();
  renderMarketProxy();
  renderBrokerRates();
  renderFedSnapshot();
  renderEconCalendar();

  const chartChanged = state.chart?.point_count !== prevCount ||
                       state.chart?.last_updated !== prevUpdated;
  if ((chartChanged || !chartInstance) && state.chartView === 'today') {
    renderChart();
  }
}

function _startCountdown() {
  if (_countdownHandle) clearInterval(_countdownHandle);
  _nextRefreshAt = Date.now() + _getRefreshInterval() * 1000;

  _countdownHandle = setInterval(async () => {
    const rem = Math.max(0, _nextRefreshAt - Date.now());
    const m   = Math.floor(rem / 60000);
    const s   = Math.floor((rem % 60000) / 1000);
    const cd  = $('countdown');
    if (cd) cd.textContent = rem > 0
      ? `Refreshing in ${m}:${s.toString().padStart(2, '0')}`
      : 'Updating…';

    if (rem <= 0) {
      // Schedule next interval BEFORE awaiting so counter resets immediately
      _nextRefreshAt = Date.now() + _getRefreshInterval() * 1000;
      await doRefresh();
    }
  }, 1000);
}

function getAnchorData() {
  const idx = state.index;
  if (!idx) return null;
  const key = state.anchorKey || idx.default_anchor_key || '0715';
  return idx.anchors?.[key] || idx.anchors?.['0715'] || null;
}

function renderAnchorSelector() {
  const sel = $('anchor-select');
  const opts = state.index?.available_anchor_options;
  if (!Array.isArray(opts) || opts.length === 0) { sel.innerHTML = '<option value="">No anchors</option>'; return; }
  sel.innerHTML = opts.map(o =>
    `<option value="${o.anchor_key}"${o.anchor_key === state.anchorKey ? ' selected' : ''}>${o.label || o.anchor_key}</option>`
  ).join('');
  sel.onchange = () => { state.anchorKey = sel.value; renderPricingEngine(); };
}

function renderPricingEngine() {
  const idx = state.index;
  if (!idx) { $('pricing-cards').innerHTML = '<p style="color:var(--muted);font-size:.85rem;">Data unavailable</p>'; return; }

  // Market closed badge
  const mktClosed = !isMarketOpen();
  const mcb = $('market-closed-badge');
  if (mcb) mcb.style.display = mktClosed ? '' : 'none';

  // Quality badge
  const qb = $('quality-badge');
  const dq = idx.data_quality || (getAnchorData()?.data_quality);
  if (dq) {
    const isOk = /good|ok|live/i.test(dq);
    const isWarn = /partial|stale|warn/i.test(dq);
    qb.textContent = dq;
    qb.className = 'quality-badge ' + (isOk ? 'quality-ok' : isWarn ? 'quality-warn' : 'quality-err');
  } else {
    qb.textContent = '';
  }

  const d = getAnchorData();

  const products = [
    { label: 'Conventional', pts: num(d?.live_conventional_index_pts), signal: d?.conv_signal },
    { label: 'FHA',          pts: num(d?.live_fha_index_pts),          signal: d?.fha_signal  },
    { label: 'VA',           pts: num(d?.live_va_index_pts),           signal: d?.va_signal   },
  ];

  $('pricing-cards').innerHTML = products.map(p => {
    const ptsClass = p.pts == null ? 'neutral' : p.pts > 0 ? 'positive' : p.pts < 0 ? 'negative' : 'neutral';
    const sig      = (p.signal || '').toUpperCase();
    const sigClass = sig === 'BETTER' ? 'signal-better' : sig === 'WORSE' ? 'signal-worse' : 'signal-flat';
    const ptsStr   = p.pts != null ? (p.pts >= 0 ? '+' : '') + fmt(p.pts, 2) + ' pts' : '— pts';
    const bps      = p.pts != null ? p.pts * 100 : null;
    const sigWord  = sig === 'BETTER' ? 'better' : sig === 'WORSE' ? 'worse' : sig === 'FLAT' ? 'flat' : '';
    const bpsStr   = bps != null && sigWord ? fmt(Math.abs(bps), 1) + ' bps ' + sigWord : '';
    return `<div class="pricing-card">
      <div class="card-product">${p.label}</div>
      <div class="card-pts ${ptsClass}">${ptsStr}</div>
      <div class="card-pts-label">vs selected anchor</div>
      ${bpsStr ? `<div class="card-bps">${bpsStr}</div>` : ''}
      ${sig ? `<div class="signal-badge ${sigClass}${mktClosed ? ' closed' : ''}">${sig}</div>` : ''}
    </div>`;
  }).join('');
}

// ── Inline Chart.js plugin: zero-line + green/red zone shading ─────────────
const _zeroBgPlugin = {
  id: 'zeroBg',
  beforeDatasetsDraw(chart) {
    const { ctx, chartArea, scales } = chart;
    if (!chartArea || !scales.y) return;
    const { top, bottom, left, right } = chartArea;
    const zero = Math.max(top, Math.min(bottom, scales.y.getPixelForValue(0)));
    ctx.save();
    ctx.fillStyle = 'rgba(34,197,94,0.07)';
    ctx.fillRect(left, top, right - left, zero - top);
    ctx.fillStyle = 'rgba(239,68,68,0.07)';
    ctx.fillRect(left, zero, right - left, bottom - zero);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.moveTo(left, zero); ctx.lineTo(right, zero); ctx.stroke();
    ctx.restore();
  },
};

// ── Core chart builder ─────────────────────────────────────────────────────
// pts: array of { label, conv, govt, fha, va, convPer100k? }
function renderChartFromPoints(pts) {
  const wrap = document.querySelector('.chart-wrap');
  if (!wrap) return;

  _chartPoints = pts || [];

  if (!pts || pts.length === 0) {
    if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
    wrap.innerHTML = '<p style="color:var(--muted);font-size:.85rem;padding:2.5rem 0;text-align:center;">No data for this period</p>';
    return;
  }

  // Restore canvas if previously replaced by a message
  if (!$('lockiq-chart-canvas')) {
    wrap.innerHTML = '<canvas id="lockiq-chart-canvas"></canvas>';
  }

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  const sparse = pts.length > 30;

  chartInstance = new Chart($('lockiq-chart-canvas'), {
    type: 'line',
    plugins: [_zeroBgPlugin],
    data: {
      labels: pts.map(p => p.label),
      datasets: [
        {
          label: 'Conventional',
          data: pts.map(p => p.conv != null ? p.conv * 100 : null),
          borderColor: '#22c55e',
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: sparse ? 0 : 3,
          pointHoverRadius: 5,
          tension: 0.3,
          hidden: false,
        },
        {
          label: "Gov’t",
          data: pts.map(p => p.govt != null ? p.govt * 100 : null),
          borderColor: '#3b82f6',
          backgroundColor: 'transparent',
          borderWidth: 2,
          borderDash: [6, 3],
          pointRadius: sparse ? 0 : 3,
          pointHoverRadius: 5,
          tension: 0.3,
          hidden: false,
        },
        {
          label: 'FHA',
          data: pts.map(p => p.fha != null ? p.fha * 100 : null),
          borderColor: '#f5a623',
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: sparse ? 0 : 3,
          pointHoverRadius: 5,
          tension: 0.3,
          hidden: true,
        },
        {
          label: 'VA',
          data: pts.map(p => p.va != null ? p.va * 100 : null),
          borderColor: '#a855f7',
          backgroundColor: 'transparent',
          borderWidth: 2,
          pointRadius: sparse ? 0 : 3,
          pointHoverRadius: 5,
          tension: 0.3,
          hidden: true,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          labels: {
            color: '#8aaad4',
            font: { size: 11 },
            boxWidth: 24,
            usePointStyle: true,
            pointStyleWidth: 16,
          },
        },
        tooltip: {
          backgroundColor: '#0f1f3d',
          borderColor: '#1a3366',
          borderWidth: 1,
          titleColor: '#e8edf5',
          bodyColor: '#8aaad4',
          padding: 10,
          callbacks: {
            title: items => _chartPoints[items[0]?.dataIndex]?.label ?? items[0]?.label ?? '',
            label: ctx => {
              const v = ctx.parsed.y;   // already in bps (pts × 100)
              if (v == null) return null;
              return `${ctx.dataset.label}: ${v >= 0 ? '+' : ''}${v.toFixed(1)} bps`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#8aaad4', font: { size: 10 }, maxTicksLimit: 10, maxRotation: 0 },
          grid:  { color: 'rgba(26,51,102,0.4)' },
        },
        y: {
          min: -50,
          max:  50,
          ticks: {
            color: '#8aaad4',
            font: { size: 10 },
            stepSize: 25,
            callback: v => (v >= 0 ? '+' : '') + v.toFixed(0),
          },
          grid: {
            // zero line drawn by _zeroBgPlugin; suppress it here to avoid doubling
            color: ctx => ctx.tick.value === 0 ? 'transparent' : 'rgba(26,51,102,0.4)',
          },
        },
      },
    },
  });
}

// ── Load data for active view then render ──────────────────────────────────
async function loadAndRenderChart() {
  const view = state.chartView;

  if (view === 'today') {
    const rawPts = state.chart?.points || [];
    renderChartFromPoints(rawPts.length ? rawPts.map(p => ({
      label: formatTime12(p.time) || p.anchor_key || '',
      conv:  num(p.conv_index_pts),
      govt:  num(p.govt_index_pts),
      fha:   num(p.fha_index_pts),
      va:    num(p.va_index_pts),
    })) : null);
    return;
  }

  const daysMap  = { yesterday: 3, week: 7, '30d': 30 };
  const days     = daysMap[view] || 7;
  const cacheKey = String(days);
  const now      = Date.now();
  const cached   = state.historyCache[cacheKey];

  let docs;
  if (cached && (now - cached.ts) < 5 * 60 * 1000) {
    docs = cached.data;
  } else {
    renderChartFromPoints(null);   // brief "no data" while fetching
    docs = await fetchHistory(days);
    state.historyCache[cacheKey] = { data: docs, ts: now };
  }

  if (view !== state.chartView) return;   // view changed while fetching

  if (!Array.isArray(docs) || !docs.length) { renderChartFromPoints(null); return; }

  let pts;
  if (view === 'yesterday') {
    const todayStr = new Date().toISOString().slice(0, 10);
    const yDoc = [...docs].reverse().find(d => d.date < todayStr) || docs[docs.length - 1];
    const raw  = yDoc?.intraday_points || [];
    pts = raw.map(p => ({
      label: formatTime12(p.time) || p.anchor_key || '',
      conv:  num(p.conv_index_pts),
      govt:  num(p.govt_index_pts),
      fha:   num(p.fha_index_pts),
      va:    num(p.va_index_pts),
    }));
  } else {
    pts = docs.map(d => ({
      label: d.date,
      conv:  num(d.conv_close),
      govt:  num(d.govt_close),
      fha:   num(d.fha_close),
      va:    num(d.va_close),
    }));
  }

  renderChartFromPoints(pts.length ? pts : null);
}

function renderChart() { loadAndRenderChart(); }

// SECTION 6 — ECONOMIC CALENDAR
// ════════════════════════════════════════════════════════════════════════════
function renderEconCalendar() {
  const calEl = $('cal-content');
  if (!state.market) {
    calEl.innerHTML = '<p class="cal-empty">No calendar data</p>';
    return;
  }

  // Pick event source by tab
  const pad = n => String(n).padStart(2, '0');
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);
  const tomorrowStr = `${tmr.getFullYear()}-${pad(tmr.getMonth()+1)}-${pad(tmr.getDate())}`;
  const thisWeek = getWeekRange(0);
  const nextWeek = getWeekRange(1);

  let rawEvents;
  if (state.calTab === 'today') {
    rawEvents = state.market.econ_calendar_today?.events || [];
  } else if (state.calTab === 'tomorrow') {
    rawEvents = (state.market.econ_calendar_upcoming?.events || [])
      .filter(e => e.date === tomorrowStr);
  } else if (state.calTab === 'week') {
    rawEvents = (state.market.econ_calendar_upcoming?.events || [])
      .filter(e => e.date >= thisWeek.start && e.date <= thisWeek.end);
  } else {
    rawEvents = (state.market.econ_calendar_upcoming?.events || [])
      .filter(e => e.date >= nextWeek.start && e.date <= nextWeek.end);
  }

  // Keep High, Medium, and any star_event; drop Low non-stars
  const events = rawEvents.filter(e =>
    e.impact_label !== 'Low' || e.star_event === true
  );

  if (events.length === 0) {
    calEl.innerHTML = '<p class="cal-empty">No events for this period</p>';
    return;
  }

  const showDate  = state.calTab !== 'today';
  const dateHdr   = showDate ? '<th>Date</th>' : '';
  const rows = events.map(e => {
    const badge    = e.impact_label === 'High'
      ? '<span class="impact-high">HIGH</span>'
      : '<span class="impact-medium">MED</span>';
    const forecast = (e.forecast != null && e.forecast !== '') ? e.forecast : '—';
    const actual   = (e.actual   != null && e.actual   !== '') ? e.actual   : null;
    const dateCell = showDate ? `<td style="color:var(--muted)">${e.date || ''}</td>` : '';
    return `<tr>
      ${dateCell}
      <td style="color:var(--muted);white-space:nowrap">${e.time || '—'}</td>
      <td>${e.event || ''}</td>
      <td>${badge}</td>
      <td style="text-align:right;color:var(--muted)">${forecast}</td>
      <td style="text-align:right">${actual != null ? actual : '<span style="color:var(--muted)">—</span>'}</td>
    </tr>`;
  }).join('');

  calEl.innerHTML = `<table class="cal-table">
    <thead><tr>${dateHdr}<th>Time (ET)</th><th>Event</th><th>Impact</th><th style="text-align:right">Forecast</th><th style="text-align:right">Actual</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// INIT
// ════════════════════════════════════════════════════════════════════════════
async function initDashboard() {
  // Chart view tabs
  document.querySelectorAll('.chart-view-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.chart-view-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.chartView = btn.dataset.view;
      renderChartSummary();
      loadAndRenderChart();
    });
  });

  // Calendar tab switcher
  document.querySelectorAll('.cal-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.cal-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.calTab = btn.dataset.tab;
      renderEconCalendar();
    });
  });

  // Initial load — fetch immediately, then start time-aware countdown
  $('refresh-indicator').className = 'stale';
  let ok = false;
  try { ok = await fetchAll(); } catch (_) {}
  $('refresh-indicator').className = ok ? '' : 'error';
  const ts = new Date();
  $('last-updated').textContent = 'Updated ' + ts.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  renderAll();
  _startCountdown();
}

// ════════════════════════════════════════════════════════════════════════════
// CLERK AUTH GATE (preserved from previous version)
// ════════════════════════════════════════════════════════════════════════════
(async () => {
  const loading  = $('loading-screen');
  const appShell = $('app-shell');
  const params   = new URLSearchParams(window.location.search);

  function showApp(email) {
    loading.style.display  = 'none';
    appShell.style.display = 'block';
    $('user-email').textContent = email || '';
    initDashboard();
  }

  async function goToCheckout(token) {
    const res = await fetch('/.netlify/functions/createCheckoutSession', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) throw new Error('createCheckoutSession failed');
    const { url } = await res.json();
    window.location.href = url;
  }

  // Try Clerk
  let clerk = null;
  try {
    const res = await fetch('/.netlify/functions/getConfig');
    if (res.ok) {
      const { clerkPublishableKey } = await res.json();
      if (window.Clerk && clerkPublishableKey) {
        await window.Clerk.load({ publishableKey: clerkPublishableKey });
        clerk = window.Clerk;
      }
    }
  } catch { /* Clerk unavailable */ }

  // No Clerk → show dashboard ungated (dev mode)
  if (!clerk) {
    showApp('');
    $('sign-out-btn').style.display = 'none';
    return;
  }

  // Must be signed in
  if (!clerk.user) { window.location.href = '/'; return; }

  const email = clerk.user.primaryEmailAddress?.emailAddress || '';
  const token = await clerk.session.getToken();

  $('sign-out-btn').addEventListener('click', async () => {
    await clerk.signOut();
    window.location.href = '/';
  });

  // New signup → Stripe
  if (params.get('checkout') === '1') {
    history.replaceState(null, '', '/app.html');
    try { await goToCheckout(token); } catch { showApp(email); }
    return;
  }

  // Returning from Stripe → show optimistically
  if (params.get('checkout') === 'complete') {
    history.replaceState(null, '', '/app.html');
    showApp(email);
    return;
  }

  // Normal visit → check subscription
  try {
    const res = await fetch('/.netlify/functions/checkSubscription', {
      headers: { 'Authorization': `Bearer ${token}` },
    });
    if (!res.ok) throw new Error();
    const { status } = await res.json();
    if (status === 'active') {
      showApp(email);
    } else {
      await goToCheckout(token);
    }
  } catch {
    showApp(email); // subscription check error → show rather than block
  }
})();
</script>
</body>
</html>
